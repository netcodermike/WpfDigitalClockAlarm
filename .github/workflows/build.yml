name: Windows build and regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build WpfDigitalClockAlarm.Tests/WpfDigitalClockAlarm.Tests.csproj -c Release
      - run: dotnet run --project WpfDigitalClockAlarm.Tests/WpfDigitalClockAlarm.Tests.csproj -c Release --no-build
